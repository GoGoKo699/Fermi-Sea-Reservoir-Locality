name: Hosted math review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: hosted-math-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    if: github.repository == 'GoGoKo699/Fermi-Sea-Reservoir-Locality'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCIENCE_REVISION: 06c965bc030321501bd2ad3efc30d33af5fc7412
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify collector bytes
        run: |
          sha256sum --check <<'HASHES'
          49182eaf354e86f685a4976814d672de5d7329a2d9e42f62a5227e2bc07c2d18  verification/hosted_ci/capture_hosted_math.cjs
          edbc2d72af94e96b78166d74b66fcea150134f2f3ebaaea121e9057768e1dbfe  verification/hosted_ci/check_rendered_math.py
          HASHES
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/hosted-deps" --no-audit --no-fund playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/hosted-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture pinned GitHub mathematics
        env:
          NODE_PATH: ${{ runner.temp }}/hosted-deps/node_modules
        run: |
          node verification/hosted_ci/capture_hosted_math.cjs --root "$GITHUB_WORKSPACE" --repository GoGoKo699/Fermi-Sea-Reservoir-Locality --revision "$SCIENCE_REVISION" --output "$RUNNER_TEMP/hosted-evidence" --page README.md --page science/gaussian_stationarity.md
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-math-early-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted-evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
